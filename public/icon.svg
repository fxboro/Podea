<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2A37" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFCA8D" />
      <stop offset="50%" stop-color="#C7A75D" />
      <stop offset="100%" stop-color="#A3833C" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#C7A75D" stroke-opacity="0.2" stroke-width="4" />
  
  <!-- Podea 'P' Monogram + Care Leaf Accent -->
  <g transform="translate(136, 100)">
    <!-- Main Stem of P -->
    <rect x="0" y="0" width="44" height="312" rx="22" fill="#FCFAF8" />
    <!-- Loop of P -->
    <path d="M22 0 H140 C195 0, 230 35, 230 96 C230 157, 195 192, 140 192 H22 Z" fill="none" stroke="#FCFAF8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Golden Wellness Accent / Sparkle Leaf -->
    <path d="M170 40 C170 40, 205 15, 245 40 C245 40, 220 85, 170 40 Z" fill="url(#gold)" />
    <circle cx="240" cy="28" r="10" fill="#DFCA8D" />
  </g>
</svg>